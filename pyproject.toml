[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markerseek"
version = "0.1.0"
description = "Nucleotide diversity analysis for chloroplast GenBank collections."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
  {name = "Gao Chengwen"}
]
dependencies = [
  "biopython>=1.84",
  "fastapi>=0.115",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "primer3-py>=2.0",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.0",
]

[project.scripts]
markerseek = "markerseek.cli:main"
markerseek-web = "markerseek.web.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"markerseek.web" = ["templates/*.html", "static/*.css", "static/*.svg"]
